name: Piko
options:
  bundleIdPrefix: dev.piko
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  Piko:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""   # fill in before device builds

targets:
  Piko:
    type: application
    platform: iOS
    sources: [Piko, SharedIntents, Assets.xcassets]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Piko
        products: [PikoKit, PikoBridge, PikoAudio, PikoTranscribe, PikoBrain, PikoMemory, PikoUI]
      - target: PikoKeyboard
        embed: true
      - target: PikoWidgets
        embed: true
    info:
      path: Piko/Info.plist
      properties:
        UILaunchScreen: {}                   # without this iOS letterboxes the app into a compatibility window
        UIBackgroundModes: [audio, processing]  # C3 keeps the armed session alive; processing runs memory maintenance
        BGTaskSchedulerPermittedIdentifiers: [dev.piko.memory.maintenance]
        NSMicrophoneUsageDescription: "Piko turns what you say into text. On-device by default; cloud transcription is opt-in and only sends audio when you turn it on in Settings."
        NSSpeechRecognitionUsageDescription: "Piko uses on-device speech recognition to stream words as you speak."
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.piko.debug
            CFBundleURLSchemes: [piko]
    entitlements:
      path: Piko/Piko.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.piko.shared]

  PikoKeyboard:
    type: app-extension
    platform: iOS
    sources: [PikoKeyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.piko.Piko.PikoKeyboard
    # Deliberately short. CONSTRAINTS C4 — this list is the ~60 MB ceiling in build form.
    dependencies:
      - package: Piko
        products: [PikoKit, PikoBridge, PikoUI]
    info:
      path: PikoKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Piko
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true         # required for the App Group to be writable
    entitlements:
      path: PikoKeyboard/PikoKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.piko.shared]

  PikoWidgets:
    type: app-extension
    platform: iOS
    sources: [PikoWidgets, SharedIntents, PikoWidgets/PetFrames]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.piko.Piko.PikoWidgets
    dependencies:
      - package: Piko
        products: [PikoKit, PikoBridge, PikoUI]
    info:
      path: PikoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Piko
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PikoWidgets/PikoWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.piko.shared]

  PikoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.piko.Piko.PikoUITests
        TEST_TARGET_NAME: Piko
    dependencies:
      - target: Piko
    info:
      path: UITests/Info.plist
      properties: {}

schemes:
  Piko:
    build:
      targets:
        Piko: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PikoUITests
  PikoKeyboard:
    build:
      targets:
        PikoKeyboard: all
  PikoWidgets:
    build:
      targets:
        PikoWidgets: all
