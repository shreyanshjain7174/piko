name: CI
on: [push, pull_request]

jobs:
  modules:
    # GitHub's Xcode 27 preview image: actions/runner-images#14404.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          major="$(xcodebuild -version | awk '/^Xcode / {split($2, version, "."); print version[1]}')"
          test "$major" -ge 27
      - name: Test modules
        run: make test

  keyboard-weight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keyboard target must stay light
        # CONSTRAINTS C4. If PikoBrain, PikoAudio, PikoTranscribe, PikoMemory or PikoMind ever appear in
        # the PikoKeyboard target, fail here rather than on a device with no crash log.
        run: |
          python3 - <<'PY'
          import re, sys
          spec = open('App/project.yml').read()
          block = spec.split('PikoKeyboard:')[1].split('PikoWidgets:')[0]
          banned = ['PikoBrain', 'PikoAudio', 'PikoTranscribe', 'PikoMemory', 'PikoMind']
          found = [b for b in banned if b in block]
          if found:
              sys.exit(f"Keyboard target links heavy modules: {found} — see docs/CONSTRAINTS.md C4")
          print("keyboard target is clean")
          PY
