name: Speech runner spike (report only)
on:
  pull_request:
    paths:
      - .github/workflows/speech-runner-spike.yml
      - spikes/speech-runner/**

jobs:
  speech-runner-spike:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Record environment, Speech, simulator, and WhisperKit outcomes
        continue-on-error: true
        run: python3 spikes/speech-runner/run.py
